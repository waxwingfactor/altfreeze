name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest
      - run: python -m pytest -q
      - run: python examples/make_demo.py demo
      - run: altfreeze export demo/orchard.epub --out demo/review
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python tests/distribution_smoke.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
  required:
    if: always()
    needs: [test, distribution]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test and distribution job
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DIST_RESULT: ${{ needs.distribution.result }}
        run: test "$TEST_RESULT" = success && test "$DIST_RESULT" = success
